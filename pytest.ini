[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    scanners: needs the real scanner binaries installed (skipped when missing)
    network: needs internet access (deselect with -m "not network")
filterwarnings =
    ignore::DeprecationWarning:pptx.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
